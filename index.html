<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاج - TAJ | معرض الصور الفاخر</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- الأساسيات والألوان --- */
        :root {
            --primary-color: #d4af37; /* ذهبي تاج */
            --primary-dark: #b38f2a;
            --bg-light: #ffffff;
            --bg-secondary: #f9f9fb;
            --text-dark: #222222;
            --text-muted: #666666;
            --developer-green: #2ecc71; /* لون اسم مصطفى تامر */
            --shadow-light: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- الهيدر وشريط التنقل --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.04);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            transition: var(--transition);
        }

        nav a:hover, nav a.active {
            color: var(--primary-color);
        }

        /* --- قسم معرض الصور --- */
        .gallery-section {
            padding: 60px 5%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h1 {
            font-size: 38px;
            font-weight: 800;
            position: relative;
            display: inline-block;
        }

        .section-title h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .gallery-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #eee;
            box-shadow: var(--shadow-light);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .gallery-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-color);
        }

        .gallery-img-holder {
            width: 100%;
            height: 320px;
            background: #fcfcfc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gallery-img-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .gallery-card:hover .gallery-img-holder img {
            transform: scale(1.08);
        }

        .gallery-caption {
            padding: 20px;
            text-align: center;
            background: #fff;
            border-top: 1px solid #f5f5f5;
        }

        .gallery-caption h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* --- الفوتر والحقوق --- */
        footer {
            background: #111;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }

        footer p {
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .developer-name {
            color: var(--developer-green);
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            transition: var(--transition);
        }

        .developer-name:hover {
            transform: scale(1.05);
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
        }
    </style>
</head>
<body>

    <!-- شريط التنقل -->
    <header>
        <a href="#" class="logo">
            <i class="fa-solid fa-crown" style="color: #d4af37;"></i>
            تاج <span>TAJ</span>
        </a>
        <nav>
            <ul>
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#" class="active">معرض الصور</a></li>
            </ul>
        </nav>
    </header>

    <!-- قسم عرض الصور -->
    <section class="gallery-section">
        <div class="section-title">
            <h1>معرض صور منتجات تاج</h1>
        </div>

        <div class="gallery-grid">

            <!-- 1. أرز تاج -->
            <div class="gallery-card">
                <div class="gallery-img-holder">
                    <img src="1000437198_2.jpg" alt="أرز تاج الفاخر">
                </div>
                <div class="gallery-caption">
                    <h3>أرز تاج الفاخر</h3>
                </div>
            </div>

            <!-- 2. سكر تاج -->
            <div class="gallery-card">
                <div class="gallery-img-holder">
                    <img src="1000437189_2.jpg" alt="سكر تاج العضوي">
                </div>
                <div class="gallery-caption">
                    <h3>سكر تاج العضوي</h3>
                </div>
            </div>

            <!-- 3. مكرونة تاج -->
            <div class="gallery-card">
                <div class="gallery-img-holder">
                    <img src="1000437192_2.jpg" alt="مكرونة تاج العضوية">
                </div>
                <div class="gallery-caption">
                    <h3>مكرونة تاج العضوية</h3>
                </div>
            </div>

            <!-- 4. بهارات تاج -->
            <div class="gallery-card">
                <div class="gallery-img-holder">
                    <img src="1000437195_2.jpg" alt="مجموعة بهارات تاج الملكية">
                </div>
                <div class="gallery-caption">
                    <h3>مجموعة بهارات تاج الملكية</h3>
                </div>
            </div>

        </div>
    </section>

    <!-- الفوتر وحقوق الملكية -->
    <footer>
        <p>جميع الحقوق محفوظة © 2026 - تم البرمجة بواسطة <span class="developer-name">مصطفى تامر</span></p>
    </footer>

</body>
</html>
